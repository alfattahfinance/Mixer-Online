name: Build Mixer-Online APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!android/**'
      - '!android/**/**'
      - 'android/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare complete website for APK
        shell: bash
        run: |
          set -e
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/web

          # Copy the complete website source from the repository.
          # Android project files are kept separate and are not copied.
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='android/' ./ android/app/src/main/assets/web/

          test -f android/app/src/main/assets/web/index.html
          echo "Website files packaged:"
          find android/app/src/main/assets/web -type f | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mixer-Online.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixer-online-apk
          path: Mixer-Online.apk
          if-no-files-found: error
