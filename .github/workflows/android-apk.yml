name: Build Mixer-Online APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare complete website for APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/web

          # Package the complete website from the repository.
          # The Android project and GitHub workflow files are excluded.
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='android/' ./ android/app/src/main/assets/web/

          test -s android/app/src/main/assets/web/index.html

          WEBSITE_BYTES=$(du -sb android/app/src/main/assets/web | cut -f1)
          WEBSITE_MB=$(awk -v b="$WEBSITE_BYTES" 'BEGIN {printf "%.2f", b/1048576}')
          WEBSITE_FILES=$(find android/app/src/main/assets/web -type f | wc -l)

          echo "=========================================="
          echo "WEBSITE PACKAGING CHECK"
          echo "Website size : ${WEBSITE_MB} MB (${WEBSITE_BYTES} bytes)"
          echo "Website files: ${WEBSITE_FILES}"
          echo "index.html   : OK"
          echo "=========================================="

          find android/app/src/main/assets/web -type f -printf '%P\n' | sort > android/app/src/main/assets/web/.packaged-files.txt

      - name: Prepare APK launcher logo from website icon
        shell: bash
        run: |
          set -euo pipefail
          LOGO="0000ee48-6213-4183-886c-51bef73798ff_removalai_preview.png"
          if [ ! -s "android/app/src/main/assets/web/${LOGO}" ]; then
            echo "ERROR: Website logo ${LOGO} was not found in the packaged website."
            exit 1
          fi
          mkdir -p android/app/src/main/res/drawable
          cp "android/app/src/main/assets/web/${LOGO}" android/app/src/main/res/drawable/mixer_logo.png
          test -s android/app/src/main/res/drawable/mixer_logo.png
          echo "APK launcher logo: OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify build toolchain
        working-directory: android
        run: |
          gradle --version
          gradle :app:tasks --no-daemon

      - name: Build debug APK
        working-directory: android
        run: gradle -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true :app:assembleDebug --no-daemon --stacktrace

      - name: Verify website is inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          echo "=========================================="
          echo "APK PACKAGING CHECK"
          echo "APK size: $(du -h "$APK" | cut -f1)"

          if ! unzip -l "$APK" | grep -q 'assets/web/index.html'; then
            echo "ERROR: assets/web/index.html is missing from the APK"
            exit 1
          fi

          if ! unzip -l "$APK" | grep -q 'res/drawable/mixer_logo.png'; then
            echo "ERROR: mixer_logo.png is missing from the APK"
            exit 1
          fi

          APK_ASSET_FILES=$(unzip -Z1 "$APK" | grep '^assets/web/' | wc -l)
          APK_ASSET_BYTES=$(unzip -l "$APK" | awk '/assets\/web\// {sum += $1} END {print sum+0}')
          APK_ASSET_MB=$(awk -v b="$APK_ASSET_BYTES" 'BEGIN {printf "%.2f", b/1048576}')

          echo "assets/web files: ${APK_ASSET_FILES}"
          echo "assets/web size : ${APK_ASSET_MB} MB (${APK_ASSET_BYTES} bytes)"
          echo "index.html      : PRESENT"
          echo "launcher logo   : PRESENT"
          echo "=========================================="

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mixer-Online.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixer-online-apk
          path: Mixer-Online.apk
          if-no-files-found: error
