<style>
  /* ==========================================================
     1. DEFINISI VARIABEL WARNA (SKIN)
     ========================================================== */
  .knob-val {
    font-size: 8px !important;
    color: var(--accent-color) !important;
    font-weight: bold !important;
    display: block !important;
    text-align: center !important;
    margin-top: 1px !important;
  }
  
  body, body.theme-midas {
    --main-bg: #090b0c;
    --panel-bg: #0c1219;
    --panel-border: #1a2736;
    --accent-color: #00e5ff;
    --header-bg: linear-gradient(90deg, #0b131a, #132230, #0b131a);
    --btn-active: linear-gradient(180deg, #00a8cc 0%, #00738c 100%);
    --text-main: #ffffff;
    --text-dim: #8899a6;
    --strip-bg: #0b1017;
  }

  body.theme-x32 {
    --main-bg: #10141a;
    --panel-bg: #18202a;
    --panel-border: #2c3e50;
    --accent-color: #f39c12;
    --header-bg: linear-gradient(90deg, #2c3e50, #1b222c, #2c3e50);
    --btn-active: linear-gradient(180deg, #e67e22 0%, #d35400 100%);
    --text-main: #ffffff;
    --text-dim: #a0b0c0;
    --strip-bg: #141b24;
  }

  body.theme-gold {
    --main-bg: #12100e;
    --panel-bg: #1c1815;
    --panel-border: #382d24;
    --accent-color: #f1c40f;
    --header-bg: linear-gradient(90deg, #2a221b, #1c1815, #2a221b);
    --btn-active: linear-gradient(180deg, #f39c12 0%, #b7950b 100%);
    --text-main: #fff8e7;
    --text-dim: #9c8a75;
    --strip-bg: #161310;
  }

  body.theme-dark {
    --main-bg: #050505;
    --panel-bg: #0f0f0f;
    --panel-border: #222222;
    --accent-color: #2ecc71;
    --header-bg: linear-gradient(90deg, #181818, #0f0f0f, #181818);
    --btn-active: linear-gradient(180deg, #2ecc71 0%, #1e8449 100%);
    --text-main: #eeeeee;
    --text-dim: #666666;
    --strip-bg: #0a0a0a;
  }

  /* ==========================================================
     2. GLOBAL RESET & OVERRIDE
     ========================================================== */
  *, *::before, *::after {
    box-sizing: border-box !important;
  }

  html {
    scroll-behavior: smooth !important;
  }

  body {
    background: var(--main-bg) !important;
    color: var(--text-main) !important;
    margin: 0 !important;
    padding: 0 !important;
    font-family: system-ui, -apple-system, sans-serif !important;
    overflow-x: auto !important;
  }

  header.topbar {
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 6px !important;
    padding: 6px 10px !important;
    background: var(--header-bg) !important;
    border-bottom: 1px solid var(--panel-border) !important;
    position: relative !important;
    z-index: 100 !important;
  }

  header.topbar, .system-box, .bridge-head, .status-head, .scene-head,
  .channel-bank, .new-channel-strip, .channel-strip, .master-rack,
  .media-rack, .midas-block, .aux-unit, .screen-frame, .midas-tft-screen,
  .device-connection, .bridge-panel, .connection-test-panel, .status-footer {
    background: var(--panel-bg) !important;
    border-color: var(--panel-border) !important;
    color: var(--text-main) !important;
  }

  .scene-head {
    position: static !important;
    transform: none !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    padding: 2px 6px !important;
  }

  .scene-head div {
    display: flex !important;
    gap: 3px !important;
  }

  .scene-head button {
    font-size: 8px !important;
    padding: 3px 5px !important;
    border-radius: 3px !important;
    cursor: pointer !important;
  }

  .clock-head {
    background: transparent !important;
    border: none !important;
    padding: 0 6px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-end !important;
    justify-content: center !important;
  }

  .clock-head .box-title {
    font-size: 7px !important;
    color: var(--text-dim) !important;
  }

  #clock {
    font-size: 13px !important;
    font-weight: bold !important;
    color: var(--accent-color) !important;
    font-family: monospace, monospace !important;
  }

  /* ==========================================================
     3. MAIN CONSOLE - PRESISI MENTOK BATAS BAWAH SEJAJAR AUX
     ========================================================== */
  main.console {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    width: max-content !important;
    min-width: 100% !important;
    padding: 2px !important;
    gap: 0px !important;
    align-items: stretch !important; /* Memaksa seluruh kolom dari Kiri ke Kanan memiliki tinggi sama persis */
  }

  .channel-bank {
    flex: 0 0 auto !important;
    width: 505px !important;
    min-width: 480px !important;
    background: var(--strip-bg) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 4px !important;
    padding: 4px 2px 0px 2px !important; /* Padding bawah 0px agar mentok ke garis bawah */
    display: flex !important;
    flex-direction: column !important;
    margin: 0 !important;
    justify-content: space-between !important;
    height: 100% !important; /* Mengisi penuh tinggi container halaman */
  }

  /* GRID 7 KOLOM DENGAN PELEBARAN CH7 & CH14 */
  #channels, #channelsRight {
    display: grid !important;
    grid-template-columns: repeat(6, 1fr) 1.25fr !important;
    width: 100% !important;
    height: 100% !important;
    flex-grow: 1 !important;
    gap: 0 !important;
    align-items: stretch !important;
  }

  .new-channel-strip, .channel-strip {
    width: 100% !important;
    min-width: 0 !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: space-between !important; /* Mendorong tombol SOLO & Fader ke paling bawah */
    padding: 2px 2px 2px 2px !important;
    border-right: 1px dashed var(--panel-border) !important;
    box-sizing: border-box !important;
    height: 100% !important; /* Memanjang penuh sampai batas bawah */
  }

  .new-channel-strip:last-child, .channel-strip:last-child {
    border-right: none !important;
    padding-right: 4px !important;
  }

  .ch-top-vu {
    width: 5px !important;
    height: 38px !important;
    background: #06090c !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 2px !important;
    margin: 2px auto 4px auto !important;
    overflow: hidden !important;
    display: flex !important;
    flex-direction: column-reverse !important;
    padding: 0 !important;
  }

  .ch-top-vu-fill {
    width: 100% !important;
    height: 0%;
    background: linear-gradient(0deg, #2ecc71 0%, #2ecc71 65%, #f1c40f 85%, #e74c3c 100%) !important;
    transition: height 0.08s ease-out !important;
  }

  .new-channel-control {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
    margin-bottom: 2px !important;
  }

  .ch-controls-group {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    gap: 2px !important;
    width: 100% !important;
    margin-bottom: 2px !important;
  }

  .volume-label-text {
    font-size: 7px !important;
    font-weight: bold !important;
    color: var(--text-dim) !important;
    text-transform: uppercase !important;
    margin: 2px 0 !important;
    text-align: center !important;
  }

  .fader-area {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: flex-end !important;
    flex-grow: 1 !important;
    width: 100% !important;
    padding-bottom: 0px !important;
    margin-bottom: 0px !important;
  }

  .fader-area input[type="range"], .channel-fader {
    height: 175px !important;
    accent-color: var(--accent-color) !important;
  }

  /* KONSOL TENGAH (M32 SCREEN + PLAYER + AUX) */
  .center-console {
    flex: 0 0 320px !important;
    width: 320px !important;
    min-width: 320px !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important; /* Menyebar elemen sehingga AUX didorong penuh ke bawah */
    gap: 4px !important;
    position: relative !important;
    margin: 0 !important;
    height: 100% !important;
  }

  /* MASTER RACK */
  .master-rack {
    flex: 0 0 72px !important;
    width: 72px !important;
    min-width: 72px !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    align-items: center !important;
    background: var(--strip-bg) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 4px !important;
    padding: 4px 2px 2px 2px !important;
    margin: 0 !important;
    height: 100% !important;
  }

  .meter-rack {
    width: 100% !important;
  }

  .main-meters {
    display: flex !important;
    gap: 3px !important;
    justify-content: center !important;
    height: 85px !important;
    background: var(--main-bg) !important;
    padding: 2px !important;
    border-radius: 4px !important;
    border: 1px solid var(--panel-border) !important;
  }

  .meter-bar-container {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    height: 100% !important;
    width: 6px !important;
  }

  .meter-bar-bg {
    width: 100% !important;
    height: 100% !important;
    background: #111a24 !important;
    border-radius: 2px !important;
    position: relative !important;
    overflow: hidden !important;
    display: flex !important;
    align-items: flex-end !important;
  }

  .meter-bar-fill {
    width: 100% !important;
    height: 0%;
    background: linear-gradient(0deg, #2ecc71 0%, #f1c40f 70%, #e74c3c 100%) !important;
    transition: height 0.05s ease-out !important;
  }

  .meter-label {
    font-size: 7px !important;
    font-weight: bold !important;
    color: var(--accent-color) !important;
    margin-top: 1px !important;
  }

  .master-card {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    width: 100% !important;
    margin: 4px 0 !important;
  }

  .master-card h2 {
    font-size: 8px !important;
    margin: 0 0 2px 0 !important;
    color: #e74c3c !important;
  }

  .master-card input[type="range"] {
    height: 135px !important;
    width: 8px !important;
    accent-color: #00e5ff !important;
  }

  .master-card output {
    font-size: 8px !important;
    font-weight: bold !important;
    color: var(--accent-color) !important;
    margin-top: 2px !important;
  }

  .monitor-card, .phones-card {
    font-size: 6.5px !important;
    text-align: center !important;
    width: 100% !important;
    padding: 1px 0 !important;
  }

  /* ==========================================================
     4. NAVIGATION BAR SCREEN M32
     ========================================================== */
  .screen-frame {
    display: flex !important;
    flex-direction: column !important;
    border: 2px solid var(--panel-border) !important;
    border-radius: 6px !important;
    padding: 4px !important;
    background: var(--panel-bg) !important;
    width: 100% !important;
  }

  .screen-tabs {
    display: grid !important;
    grid-template-columns: repeat(6, 1fr) !important;
    gap: 2px !important;
    width: 100% !important;
    margin-bottom: 4px !important;
  }

  .screen-tabs button {
    font-size: 7px !important;
    padding: 4px 0 !important;
    text-align: center !important;
    text-transform: uppercase !important;
    border-radius: 3px !important;
    border: 1px solid var(--panel-border) !important;
    cursor: pointer !important;
    white-space: nowrap !important;
  }

  .screen-tabs button.active {
    background: var(--btn-active) !important;
    color: #fff !important;
    border-color: var(--accent-color) !important;
  }

  .m32-submenu-bar {
    display: grid !important;
    grid-template-columns: repeat(6, 1fr) !important;
    gap: 2px !important;
    width: 100% !important;
    margin-bottom: 4px !important;
  }

  .m32-sub-btn {
    font-size: 7px !important;
    padding: 4px 0 !important;
    text-align: center !important;
    text-transform: uppercase !important;
    border-radius: 3px !important;
    border: 1px solid var(--panel-border) !important;
    cursor: pointer !important;
    white-space: nowrap !important;
  }

  .m32-sub-btn.active {
    background: var(--accent-color) !important;
    color: #000 !important;
    font-weight: bold !important;
  }

  .midas-tft-screen {
    border: 1px solid var(--panel-border) !important;
    border-radius: 4px !important;
    padding: 4px !important;
    display: flex !important;
    flex-direction: column !important;
    min-height: 200px !important;
    background: var(--panel-bg) !important;
  }

  .screen-view {
    display: none !important;
    flex-grow: 1 !important;
    flex-direction: column !important;
  }

  .screen-view.active {
    display: flex !important;
  }

  .m32-sub-panel {
    display: none !important;
    flex-direction: column !important;
    flex-grow: 1 !important;
  }

  .m32-sub-panel.active {
    display: flex !important;
  }

  .pro-mini-spectrum, .rta-display, .pro-screen-grid {
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-end !important;
    min-height: 95px !important;
    background: var(--main-bg) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 4px !important;
    padding: 4px !important;
    margin-top: 4px !important;
  }

  .spectrum-bars-container {
    display: flex !important;
    gap: 2px !important;
    height: 75px !important;
    align-items: flex-end !important;
  }

  .midas-blocks-grid {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 4px !important;
    margin-top: 4px !important;
  }

  .midas-block {
    background: var(--main-bg) !important;
    border: 1px solid var(--panel-border) !important;
    padding: 4px !important;
    border-radius: 3px !important;
    text-align: center !important;
    font-size: 8px !important;
  }

  .midas-block span {
    display: block !important;
    color: var(--text-dim) !important;
    font-size: 7px !important;
    margin-bottom: 2px !important;
  }

  .midas-encoders-bar {
    display: grid !important;
    grid-template-columns: repeat(6, 1fr) !important;
    gap: 2px !important;
    margin-top: 4px !important;
  }

  .m-encoder {
    font-size: 7px !important;
    text-align: center !important;
    background: var(--main-bg) !important;
    border: 1px solid var(--panel-border) !important;
    padding: 2px 0 !important;
    color: var(--accent-color) !important;
    border-radius: 2px !important;
  }

  .screen-slider {
    width: 100%;
    accent-color: var(--accent-color);
    margin-top: 2px;
  }

  /* ==========================================================
     5. PANEL AUX & FX (RATA & SEJAJAR DENGAN DASAR CHANNEL STRIP)
     ========================================================== */
  .center-console .fx-rack,
  .center-console .aux-rack,
  #fxRack, #auxRack {
    position: static !important;
    transform: none !important;
    width: 100% !important;
    margin: 0 !important;
    background: var(--panel-bg) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 4px !important;
  }

  .center-console .aux-rack {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 4px !important;
    margin-top: auto !important; /* PATOKAN: Mendorong posisi kartu ke paling bawah */
    padding: 4px !important;
  }

  .aux-unit {
    background: var(--main-bg) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 4px !important;
    padding: 6px 4px 8px 4px !important;
    min-height: 58px !important; /* Kunci tinggi presisi agar sejajar rata fader */
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
  }

  main.console > .fx-rack, 
  main.console > .aux-rack {
    display: none !important;
  }

  /* ==========================================================
     6. BOTTOM NAV STYLING & ACTIVE STATES
     ========================================================== */
  .bottom-nav {
    display: flex !important;
    position: sticky !important;
    bottom: 0 !important;
    z-index: 9999 !important;
    width: 100% !important;
    gap: 4px !important;
    padding: 6px 8px !important;
    background: var(--panel-bg) !important;
    border-top: 1px solid var(--panel-border) !important;
  }

  .bottom-nav button {
    flex: 1 !important;
    padding: 8px 2px !important;
    font-size: 9px !important;
    font-weight: bold !important;
    background: var(--main-bg) !important;
    color: var(--text-dim) !important;
    border: 1px solid var(--panel-border) !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
  }

  .bottom-nav button.active {
    background: var(--btn-active) !important;
    color: #ffffff !important;
    border-color: var(--accent-color) !important;
    box-shadow: 0 0 6px var(--accent-color) !important;
  }
</style>
