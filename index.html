<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixer Online</title><link rel="stylesheet" href="style.css?v=20260829-65"></head><body><header class="topbar"><div><h1>MIXER ONLINE</h1><p>Digital Audio Mixer</p></div><div class="top-actions"><button id="startMic">🎤 MIC</button><label class="file-btn">🎵 AUDIO <input id="audioFile" type="file" accept="audio/*" multiple></label><label class="play-mode">MODE <select id="audioPlayMode"><option value="sequential">BERURUTAN</option><option value="random">ACAK</option></select></label><button id="connectDevice">🔗 CONNECT</button><button id="stopAll">⏹ STOP</button></div></header><main class="mixer"><div class="device-bar"><label>DEVICE <select id="deviceProfile"><option value="custom">Universal / Custom</option></select></label><label>CHANNELS <input id="channelCount" type="number" min="1" max="64" value="3"></label><button id="applyChannels">APPLY</button><span id="connectionStatus">● Offline</span></div><div class="device-config" id="deviceConfig"><span>PROFILE</span><input id="profileName" placeholder="Nama perangkat"><select id="profileProtocol"><option value="none">Custom / None</option><option value="midi">MIDI</option><option value="usb">USB Control</option><option value="network">Network / Wi-Fi</option><option value="bluetooth">Bluetooth Control</option></select><label>IN <input id="profileInputs" type="number" min="0" max="128" value="8"></label><label>OUT <input id="profileOutputs" type="number" min="0" max="64" value="2"></label><button id="saveProfile">SAVE PROFILE</button><button id="mappingToggle">INPUT MAPPING</button></div><div id="mappingPanel" class="mapping-panel" hidden></div><section id="musicPlayer" class="music-player">
<div class="music-player-head"><div><strong>🎵 MUSIC PLAYER</strong><small>PEMUTAR MUSIK TERINTEGRASI</small></div><span id="playerState" class="player-state">READY</span></div>
<div class="music-player-main">
<label class="music-pick">📂 PILIH MUSIK <input id="musicFile" type="file" accept="audio/*" multiple></label>
<button id="musicPrev" type="button">⏮ PREV</button><button id="musicPlay" type="button">▶ PLAY</button><button id="musicNext" type="button">NEXT ⏭</button><button id="musicStop" type="button">⏹ STOP</button>
<label class="music-mode">MODE <select id="musicMode"><option value="sequential">BERURUTAN</option><option value="random">ACAK</option></select></label><label class="music-mode">CH <select id="musicChannel"><option value="0">CH 1</option><option value="1">CH 2</option><option value="2">CH 3</option></select></label>
</div>
<div class="music-track"><div id="musicNowPlaying">Belum ada musik dipilih</div><div class="music-progress"><span id="musicProgress"></span></div><div class="music-times"><span id="musicCurrent">00:00</span><span id="musicDuration">00:00</span></div></div>
<div id="musicQueue" class="music-queue"><span>Playlist kosong</span></div>
<div class="music-volume"><span>VOL</span><input id="musicVolume" type="range" min="0" max="1" step="0.01" value="1"><span id="musicVolumeValue">100%</span></div>
</section><section id="channels" class="channels"></section></main><footer>🎚️ Mixer Online</footer><script src="connection.js?v=20260829-48"></script><script src="adapters.js?v=20260829-48"></script><script src="device-profile.js?v=20260829-48"></script><script src="feedback.js?v=20260829-48"></script><script src="app.js?v=20260829-66"></script></body></html>
