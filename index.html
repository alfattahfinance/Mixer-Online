<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161a"><title>Mixer Online V2</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-led"></div><div><h1>MIXER ONLINE</h1><p>Digital Audio Mixer • V2</p></div></div>
<div class="top-actions"><button id="startMic" class="primary">🎤 MIC 1</button><label class="file-btn">🎵 MUSIC 1<input id="musicFile" type="file" accept="audio/*"></label><button id="stopAll">⏹ STOP ALL</button></div></header>
<main class="mixer"><div class="console-head"><div><strong>LIVE MIX CONSOLE</strong><span id="status">Siap digunakan</span></div><button id="resetMixer" class="small-btn">↺ RESET MIXER</button></div>
<section class="channels">

ass="fader-mark">-∞</span></div><div class="fader-value">75%</div><div class="channel-actions"><button class="mute">MUTE</button><button class="solo">SOLO</button></div></article><article class="channel" data-channel="aux"><div class="channel-title"><span>AUX 1</span><small>INPUT</small></div><div class="meter"><div class="meter-fill"></div><div class="clip-dot"></div></div><div class="level-readout">-∞ dB</div><div class="knobs"><label>GAIN<input class="knob gain" type="range" min="0" max="2" step=".01" value="1"></label><label>BASS<input class="knob bass" type="range" min="-12" max="12" step=".5" value="0"></label><label>MID<input class="knob mid" type="range" min="-12" max="12" step=".5" value="0"></label><label>TREBLE<input class="knob treble" type="range" min="-12" max="12" step=".5" value="0"></label></div><div class="pan-row"><span>L</span><input class="pan" type="range" min="-1" max="1" step=".01" value="0"><span>R</span></div><div class="fader-wrap"><span class="fader-mark">0</span><input class="fader" type="range" min="0" max="1" step=".01" value=".75"><span class="fader-mark">-∞</span></div><div class="fader-value">75%</div><div class="channel-actions"><label class="load-channel">LOAD<input class="channel-file" type="file" accept="audio/*"></label><button class="mute">MUTE</button><button class="solo">SOLO</button></div></article><article class="channel" data-channel="line"><div class="channel-title"><span>LINE 1</span><small>PLAYER</small></div><div class="meter"><div class="meter-fill"></div><div class="clip-dot"></div></div><div class="level-readout">-∞ dB</div><div class="knobs"><label>GAIN<input class="knob gain" type="range" min="0" max="2" step=".01" value="1"></label><label>BASS<input class="knob bass" type="range" min="-12" max="12" step=".5" value="0"></label><label>MID<input class="knob mid" type="range" min="-12" max="12" step=".5" value="0"></label><label>TREBLE<input class="knob treble" type="range" min="-12" max="12" step=".5" value="0"></label></div><div class="pan-row"><span>L</span><input class="pan" type="range" min="-1" max="1" step=".01" value="0"><span>R</span></div><div class="fader-wrap"><span class="fader-mark">0</span><input class="fader" type="range" min="0" max="1" step=".01" value=".75"><span class="fader-mark">-∞</span></div><div class="fader-value">75%</div><div class="channel-actions"><label class="load-channel">LOAD<input class="channel-file" type="file" accept="audio/*"></label><button class="mute">MUTE</button><button class="solo">SOLO</button></div></article>

</section></main><footer>🎚️ Mixer Online V2 — Web Audio Console</footer><script src="app.js"></script>
