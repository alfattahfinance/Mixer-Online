<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixer Online</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><h1>MIXER ONLINE</h1><p>Digital Audio Mixer</p></div><div class="top-actions"><button id="startMic">🎤 MIC</button><label class="file-btn">🎵 AUDIO <input id="audioFile" type="file" accept="audio/*"></label><button id="connectDevice">🔗 CONNECT</button><button id="stopAll">⏹ STOP</button></div></header><main class="mixer"><div class="device-bar"><label>DEVICE <select id="deviceProfile"><option value="custom">Universal / Custom</option></select></label><label>CHANNELS <input id="channelCount" type="number" min="1" max="64" value="3"></label><button id="applyChannels">APPLY</button><span id="connectionStatus">● Offline</span></div><div class="device-config" id="deviceConfig"><span>PROFILE</span><input id="profileName" placeholder="Nama perangkat"><select id="profileProtocol"><option value="none">Custom / None</option><option value="midi">MIDI</option><option value="usb">USB Control</option><option value="network">Network / Wi-Fi</option><option value="bluetooth">Bluetooth Control</option></select><label>IN <input id="profileInputs" type="number" min="0" max="128" value="8"></label><label>OUT <input id="profileOutputs" type="number" min="0" max="64" value="2"></label><button id="saveProfile">SAVE PROFILE</button><button id="mappingToggle">INPUT MAPPING</button></div><div id="mappingPanel" class="mapping-panel" hidden></div><section id="channels" class="channels"></section></main><footer>🎚️ Mixer Online</footer><script src="connection.js?v=20260828-31"></script><script src="adapters.js?v=20260828-31"></script><script src="device-profile.js?v=20260828-31"></script><script src="feedback.js?v=20260828-31"></script><script src="app.js?v=20260828-31"></script></body></html>
