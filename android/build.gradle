buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.6.1 is the minimum stable AGP line that supports compileSdk 35.
        classpath 'com.android.tools.build:gradle:8.6.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
